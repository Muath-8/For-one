<title>For one prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Martian+Mono:wdth,wght@75..112.5,300..600&family=Readex+Pro:wght@200..700&display=swap">
<style>
/* Layout: a night studio. The device sits at the centre; the run of show (screens) on its left, the liner note (why it looks like this) on its right.
   One committed dark look: the product is listened to early and late, and the episode art carries the colour. */
:root{
  color-scheme:dark;
  --page:#09080D; --bg:#110F17; --s1:#1A1722; --s2:#24202E; --s3:#2F2A3B;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#F5F1EA; --mute:#A59FB2; --faint:#6E6879;
  --karim:#FF8A4C; --mona:#FF5C9A; --salma:#C9BCFF; --live:#5FE3B0; --recast:#FFC86B; --warn:#FF5D5D;
  --display:"Anybody","Arial Narrow",Impact,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--salma);outline-offset:2px}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-stretch:85%}
[dir="rtl"]{font-family:var(--body)}

/* ---------- studio chrome ---------- */
.bar{display:flex;align-items:center;gap:14px;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.mark{font-family:var(--display);font-weight:850;font-stretch:62%;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:4px 7px}
.flows{display:flex;gap:2px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px}
.flows button{border:0;background:none;padding:7px 13px;border-radius:9px;font-size:13px;color:var(--mute);font-weight:500}
.flows button[aria-current="true"]{background:var(--s3);color:var(--text)}
.ctl{display:flex;gap:8px}
.ghostbtn{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:7px 12px;font-size:13px;color:var(--mute)}
.ghostbtn[aria-pressed="true"]{color:var(--text);border-color:var(--salma)}
.menubtn{display:none}

.studio{display:grid;grid-template-columns:1fr auto 1fr;gap:44px;align-items:start;max-width:1320px;margin:0 auto;padding-block:6px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.rundown{justify-self:end;width:230px;position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;max-height:calc(100dvh - 120px);overflow:auto;padding-right:4px}
.rundown h4{font-family:var(--mono);font-stretch:85%;font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px 10px}
.rundown h4:first-child{margin-top:4px}
.rundown button{display:flex;gap:10px;align-items:baseline;border:0;background:none;text-align:left;padding:7px 10px;border-radius:9px;color:var(--mute);font-size:14px}
.rundown button small{font-family:var(--mono);font-stretch:80%;font-size:10px;color:var(--faint);min-width:18px}
.rundown button:hover{color:var(--text);background:var(--s1)}
.rundown button[aria-current="true"]{color:var(--text);background:var(--s1);box-shadow:inset 2px 0 0 var(--salma)}
.liner{justify-self:start;width:300px;position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.liner .ey{font-family:var(--mono);font-stretch:85%;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.liner h2{font-family:var(--display);font-stretch:70%;font-weight:800;font-size:34px;line-height:.92;text-transform:uppercase;margin:0;text-wrap:balance}
.liner p{color:var(--mute);font-size:14.5px;line-height:1.55}
.liner .law{font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}
.liner .vars{display:flex;flex-wrap:wrap;gap:6px}
.liner .vars button{border:1px solid var(--line2);background:none;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--mute)}
.liner .vars button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.live-flag{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute)}
.live-flag i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live-flag.on i{background:var(--live);box-shadow:0 0 0 4px rgba(95,227,176,.15)}

/* ---------- the device ---------- */
.device{height:min(852px,calc(100dvh - 96px));min-height:600px;aspect-ratio:393/852;border-radius:54px;padding:10px;background:linear-gradient(145deg,#2B2733,#121016 40%,#1F1C25);box-shadow:0 40px 90px -30px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.07);position:relative}
.screen{position:absolute;inset:10px;border-radius:44px;overflow:hidden;background:var(--bg);isolation:isolate}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
.sbar{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-size:14px;font-weight:600;position:relative;z-index:5}
.sbar .sig{display:flex;gap:5px;align-items:center}
.sbar .sig i{display:block;width:3px;border-radius:1px;background:currentColor}
.scr > *{flex-shrink:0}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 20px 30px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.enter{animation:enter .38s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.fill{flex:1}

/* type */
.d1{font-family:var(--display);font-weight:850;font-stretch:58%;text-transform:uppercase;line-height:.86;letter-spacing:.005em;margin:0;text-wrap:balance}
.d2{font-family:var(--display);font-weight:800;font-stretch:66%;text-transform:uppercase;line-height:.9;margin:0;text-wrap:balance}
.ey{font-family:var(--mono);font-stretch:85%;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)} .faint{color:var(--faint)} .sm{font-size:13px}
.ar{font-size:21px;line-height:1.6;font-weight:400}

/* buttons */
.btn{border:0;border-radius:999px;padding:15px 22px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--text);color:var(--bg);transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.dim{background:var(--s2);color:var(--text)}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.live{background:var(--live);color:#06281C}
.btn.block{width:100%}
.btn.small{padding:10px 15px;font-size:13.5px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:19px;height:19px;flex:none}
.txtbtn{border:0;background:none;padding:4px 0;color:var(--text);font-weight:500;font-size:14px;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:5px}
.txtbtn.m{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.hr{height:1px;background:var(--line)}

/* art */
canvas.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,14,0) 30%,rgba(10,8,14,.78) 100%);z-index:0}
.hero .in{position:relative;z-index:1;padding:22px;display:flex;flex-direction:column;gap:12px}
.hero .d1{font-size:58px}
.hero .sub{font-size:15.5px;max-width:30ch;color:rgba(255,255,255,.88)}
.playbig{width:68px;height:68px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .15s var(--ease)}
.playbig:active{transform:scale(.94)}
.playbig svg{width:28px;height:28px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hosts{display:flex;align-items:center;gap:8px;font-size:13.5px;color:rgba(255,255,255,.85)}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#1a0f08;flex:none}
.dot.K{background:var(--karim)} .dot.M{background:var(--mona);color:#2a0716} .dot.S{background:var(--salma);color:#1b1433;border-radius:7px}
.dot.lg{width:34px;height:34px;font-size:14px}
.dots{display:flex}
.dots .dot{box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.dots .dot + .dot{margin-left:-6px}

.mini{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1.08;display:flex;flex-direction:column;justify-content:flex-end;border:0;padding:0;text-align:left;isolation:isolate}
.mini::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,8,14,.7));z-index:0}
.mini .in{position:relative;z-index:1;padding:12px;display:flex;flex-direction:column;gap:5px}
.mini .d2{font-size:22px}
.mini .ey{color:rgba(255,255,255,.75);font-size:9.5px}
.mini.ghost{border:1.5px dashed var(--line2);background:transparent;justify-content:center;align-items:center;text-align:center}
.mini.ghost::after{display:none}

/* run of show (doors) */
.ros{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.ros::before{content:"";position:absolute;left:12.5%;right:12.5%;top:21px;height:1px;background:var(--line2)}
.ros button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;font-size:12.5px;color:var(--mute);padding:0}
.ros .k{width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;border:1px solid var(--line2);color:var(--text)}
.ros .k svg{width:18px;height:18px}
.ros .done .k{background:var(--text);color:var(--bg);border-color:var(--text)}
.ros .t{font-family:var(--mono);font-stretch:80%;font-size:9.5px;color:var(--faint)}

.quote{display:flex;gap:12px;align-items:flex-start}
.quote p{font-size:17px;line-height:1.4;font-weight:300}
.quote b{font-weight:500}
.cardline{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;width:100%;text-align:left}
.cardline + .cardline{border-top:0}
.cardline svg{width:20px;height:20px;color:var(--mute);flex:none}
.cardline small{display:block;color:var(--mute);font-size:13px}

/* tab bar */
.tabs{position:absolute;left:16px;right:16px;bottom:16px;height:62px;border-radius:24px;background:rgba(30,27,38,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);display:flex;border:1px solid var(--line);z-index:20}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);font-weight:500}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--text)}
.has-tabs .scr{padding-bottom:100px}

/* top bars inside the app */
.nav{display:flex;align-items:center;gap:12px;min-height:40px}
.circ{width:40px;height:40px;border-radius:50%;border:0;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--text)}
.circ svg{width:20px;height:20px}
.nav .t{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--mute)}
.nav .sp{width:40px}

/* orb */
.orbwrap{position:relative;display:grid;place-items:center}
.orbwrap canvas{display:block}

/* player */
.player{position:absolute;inset:0;display:flex;flex-direction:column;isolation:isolate}
.player > canvas.art{filter:blur(28px) saturate(1.2);transform:scale(1.2);opacity:.55}
.player::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,15,23,.35),rgba(17,15,23,.92) 70%);z-index:0}
.player > *{position:relative;z-index:1}
.pcover{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1;width:100%;max-width:300px;align-self:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.lines{display:flex;flex-direction:column;gap:16px;padding-bottom:10px}
.ln{font-size:19px;line-height:1.45;font-weight:300;color:rgba(255,255,255,.35);transition:color .25s}
.ln .who{display:block;font-family:var(--mono);font-stretch:80%;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.ln .who.K{color:var(--karim)} .ln .who.M{color:var(--mona)}
.ln.cur{color:var(--text);font-weight:400}
.ln.past{color:rgba(255,255,255,.55)}
.wd{border-radius:4px;transition:background .12s,color .12s;padding:0 1px}
.wd.on{background:rgba(255,255,255,.16)}
.wd.g{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(255,255,255,.45);text-underline-offset:5px;cursor:pointer}
.nowline{min-height:96px;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.nowline .who{font-family:var(--mono);font-stretch:80%;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.nowline .eq{display:flex;gap:3px;align-items:flex-end;height:26px}
.nowline .eq i{width:3px;border-radius:2px;background:currentColor;height:6px;transition:height .12s}
.deck{padding:14px 20px 22px;display:flex;flex-direction:column;gap:14px;flex:none;background:linear-gradient(180deg,transparent,rgba(17,15,23,.9) 30%)}
.scrub{display:flex;gap:3px;align-items:center;height:28px;cursor:pointer}
.scrub i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.18);transition:height .2s,background .2s}
.scrub i.p{background:var(--text)}
.scrub i.c{height:10px;background:var(--text)}
.pctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.pctl .pp{width:72px;height:72px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-items:center}
.pctl .pp svg{width:30px;height:30px}
.chipbtn{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chipbtn svg{width:16px;height:16px}
.huh{width:100%;border:0;border-radius:20px;padding:15px;background:rgba(255,255,255,.1);color:var(--text);font-family:var(--display);font-stretch:62%;font-weight:850;font-size:26px;text-transform:uppercase;letter-spacing:.02em;transition:background .2s}
.huh:active{background:rgba(255,255,255,.18)}
.huhcard{border-radius:20px;background:rgba(201,188,255,.12);border:1px solid rgba(201,188,255,.25);padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:enter .3s var(--ease)}
.huhcard .s{font-size:18px;font-weight:400}
.gl{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-top:7px;border-top:1px solid var(--line)}
.throw{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;background:var(--s1);border:1px solid var(--line2);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:rise .45s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
@keyframes rise{from{transform:translateY(60%);opacity:0}}

/* call */
.call{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 18%,rgba(255,138,76,.20),transparent 60%),var(--bg)}
.call .top{display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0}
.livep{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:600;color:var(--live)}
.livep i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.cap{font-size:21px;line-height:1.4;font-weight:300;min-height:3em;text-wrap:pretty}
.cap b{font-weight:500;color:var(--recast)}
.cap.think{color:var(--faint)}
.wordpop{align-self:flex-start;background:rgba(255,200,107,.14);color:var(--recast);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:500}
.say{display:flex;gap:8px;align-items:center;background:var(--s1);border:1px solid var(--line2);border-radius:26px;padding:6px 6px 6px 16px}
.say input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15.5px;padding:8px 0}
.say input::placeholder{color:var(--faint)}
.say .go{width:40px;height:40px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:none}
.say .go svg{width:18px;height:18px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{border:1px dashed var(--line2);background:none;border-radius:16px;padding:10px 14px;text-align:left;font-size:14px;color:var(--mute)}
.sugg button:hover{color:var(--text);border-color:var(--mute)}
.callctl{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:stretch}
.hold{border:0;border-radius:22px;background:var(--s2);padding:14px 8px;font-size:13px;font-weight:500;color:var(--mute);user-select:none;-webkit-user-select:none;touch-action:none;transition:background .15s,color .15s}
.hold.on{background:rgba(95,227,176,.16);color:var(--live)}
.hold b{display:block;font-size:14px;color:var(--text);font-weight:600}
.hold.on b{color:var(--live)}
.endc{width:60px;border-radius:22px;border:0;background:var(--warn);color:#fff;display:grid;place-items:center}
.endc svg{width:22px;height:22px}
.retell{display:grid;place-items:center;gap:6px}
.wordsheet{display:flex;gap:8px;align-items:center;background:rgba(255,200,107,.1);border:1px solid rgba(255,200,107,.3);border-radius:22px;padding:6px 6px 6px 14px}
.wordsheet input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:8px 0;text-align:right}

/* chat */
.thread{display:flex;flex-direction:column;gap:8px}
.sep{align-self:center;font-family:var(--mono);font-stretch:80%;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
.msg{max-width:80%;padding:10px 14px;border-radius:22px;font-size:15.5px;line-height:1.4;animation:enter .3s var(--ease)}
.msg.h{background:var(--s2);border-bottom-left-radius:6px;align-self:flex-start}
.msg.h b{color:var(--recast);font-weight:500}
.msg.me{background:var(--text);color:var(--bg);border-bottom-right-radius:6px;align-self:flex-end}
.msg.typing{color:var(--faint)}
.composer{flex:none;padding:10px 14px 18px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.idea{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--s1);border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.35;transition:border-color .2s}
.idea:hover{border-color:var(--mute)}
.idea .ey{display:block;margin-bottom:5px;font-size:9.5px}
.idea.sel{border-color:var(--text);background:var(--s2)}

/* sheets, toast */
.veil{position:absolute;inset:0;background:rgba(5,4,8,.55);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--s1);border-radius:30px 30px 0 0;padding:12px 22px 30px;display:flex;flex-direction:column;gap:16px;max-height:86%;overflow:auto;animation:rise .35s var(--ease);border-top:1px solid var(--line2)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line2);align-self:center}

  pick(who, lang){ const vs = this.voices.filter(v => (v.lang||'').toLowerCase().replace('_','-').startsWith(lang)); if (!vs.length) return null;
    let pool = vs; if (lang === 'en') { const want = S.accent === 'US' ? 'en-us' : 'en-gb'; const p = vs.filter(v => (v.lang||'').toLowerCase().replace('_','-') === want); if (p.length) pool = p; }
    const off = who === 'M' ? 1 + S.swapM : (who === 'K' ? S.swapK : 0); return pool[off % pool.length]; },
  can(lang){ return this.ok && VOICES && !!this.pick('K', lang); },
  speak(text, who, lang, rate, onWord, onEnd){ try { const u = new SpeechSynthesisUtterance(text); const v = this.pick(who, lang); if (v) { u.voice = v; u.lang = v.lang; }

function say(list, onProgress, onDone){ /* list of [who, text, lang] */
  sayStop(); TTS.stop(); const tok = ++SA.tok; let i = 0;
  const next = () => { if (tok !== SA.tok) return; if (i >= list.length) { speakingOff(); onProgress && onProgress(1); onDone && onDone(); return; }
    const [who, text, lang] = list[i]; onProgress && onProgress(i/list.length); i++; speakingOn(who);
    let fin = false; const go = () => { if (fin || tok !== SA.tok) return; fin = true; speakingOff(); SA.timers.push(setTimeout(next, 260)); };

}

}

/* ---- calls ---- */
let clockT = null;
function startClock(){ clearInterval(clockT); clockT = setInterval(() => { if (S.screen !== 'call' || !S.call) return clearInterval(clockT); S.call.secs++; const el = document.getElementById('ctime'); if (el) el.textContent = fmt(S.call.secs); }, 1000); }
function stopClock(){ clearInterval(clockT); }
function startCall(kind){
  stopAll();
  const sc0 = CALL_SCRIPT[kind][0]; const opener = { reply: fill(sc0.k), recast: [], end: false };
  S.call = { kind, step:0, secs:0, host:opener, turns:[{role:'assistant', content:JSON.stringify(opener)}], busy:false, ended:false, held:false, wordOpen:false, wordPop:null, retellOn:false, said:0 };
  go('call'); startClock(); setTimeout(() => hostSays(opener.reply), 400);
}
function hostSays(text){ say([['K', text, 'en']]); }
async function callTurn(text, isWord){
  const C = S.call; if (!C || C.busy || C.ended) return;
  const msg = isWord ? '[WORD] ' + text : text; C.said++; C.busy = true; C.wordOpen = false; C.wordPop = null;
  speakingOn('Y'); render(true);
  C.turns.push({ role:'user', content: msg });
  const rules = C.kind === 'first' ? FIRST_RULES() : KARIM_RULES();
  let out = await askJSON([{ role:'user', content: rules + '\n\nThe call starts now. Give your opening line.' }].concat(C.turns));
  if (S.call !== C) return;
  if (!out || typeof out.reply !== 'string') { /* scripted fallback */
    const steps = CALL_SCRIPT[C.kind]; const nx = steps[Math.min(C.step + 1, steps.length - 1)];
    out = { reply: fill(nx.k), recast: nx.r || [], end: !!nx.end };
    if (C.kind === 'today' && C.step === 3 && /remember|don/i.test(text)) out.reply = out.reply.replace('Composed. That is the one.', 'It starts with “com…”. Calm, in control: composed.');
  }
  if (C.kind === 'first' && C.step >= 1) out.end = true;
  if (C.step >= 8) out.end = true;
  C.step++; C.host = { reply: out.reply, recast: Array.isArray(out.recast) ? out.recast : [], end: !!out.end };
  C.turns.push({ role:'assistant', content: JSON.stringify(C.host) });
  if (isWord) C.wordPop = (C.host.recast[0] || '').trim() || null;
  C.retellOn = /sixty seconds|60 seconds|retell/i.test(out.reply) && !out.end;
  C.ended = C.host.end; C.busy = false; speakingOff();
  if (C.ended && C.kind === 'first') S.lastBye = out.reply;
  render(true); hostSays(out.reply);
  if (C.retellOn) requestAnimationFrame(() => requestAnimationFrame(() => { const r = document.getElementById('rring'); if (r) r.style.strokeDashoffset = '0'; }));
}
function bindCall(){
  const pad = document.getElementById('holdpad'); if (!pad) return;
  const on = e => { e.preventDefault(); if (!S.call.held) { S.call.held = true; render(true); } };
  const off = () => { if (S.call && S.call.held) { S.call.held = false; render(true); } };
  pad.addEventListener('pointerdown', on); ['pointerup','pointerleave','pointercancel'].forEach(t => pad.addEventListener(t, off));
  pad.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); on(e); const p = document.getElementById('holdpad'); if (p) p.focus(); } });
  pad.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { off(); const p = document.getElementById('holdpad'); if (p) p.focus(); } });
}

/* ---- Salma ---- */
async function salmaAnswer(text){
  const st = INTAKE[S.intake]; if (!text || S.salmaBusy) return;
  S.salmaBusy = true; render(true);
  const prompt = 'You are Salma, the AI producer of "For one", a personal language show. You speak to the learner in Arabic (friendly, plain). You asked: "'+st.en+'". The learner answered: "'+text+'".\n'+
    'Return only JSON: {"ack_ar": a warm acknowledgment in Arabic, at most 8 words, no question; "facts": a list of at most 2 facts the learner actually stated, each {"k": short English label, "v": short English value, "d": optional follow-up note if they mentioned a date or deadline, else ""}; "name": the name they want to be called if they gave one, else ""; "topic": in English, 2 to 4 words, the topic they could talk about for an hour if they gave one, else ""}. '+
    (st.ask === 'heard' ? 'This answer is them telling you what they understood of an English sentence; facts must be an empty list.' : '') + ' Never invent facts.';
  let out = await askJSON(prompt);
  if (!out) {
    out = { ack_ar:'', facts:[], name:'', topic:'' };
    if (st.ask === 'name') { out.name = text.split(/\s+/)[0]; out.facts = [{k:'Call me', v:out.name, d:'Pronunciation saved for the hosts'}]; }
    if (st.ask === 'topic') { const isEx = text === INTAKE[1].ex; out.topic = isEx ? 'football tactics' : text; out.facts = [{k:'Could talk for hours about', v: isEx ? 'Football tactics' : text}]; }
    if (st.ask === 'need') out.facts = [{k:'English for', v: text === INTAKE[2].ex ? 'A job interview in English' : text, d: text === INTAKE[2].ex ? 'Follow-up set for around Dec 13' : ''}];
    if (st.ask === 'english' && text === INTAKE[4].ex) out.facts = [{k:'People', v:'Watches every match with his brother'}];
  }
  if (out.name) S.name = String(out.name).slice(0, 24);
  if (out.topic) S.topic = String(out.topic).slice(0, 40);
  (Array.isArray(out.facts) ? out.facts : []).slice(0,2).forEach(f => { if (f && f.k && f.v) S.facts.unshift({ id: Date.now() + Math.random(), k: String(f.k), v: String(f.v), d: f.d ? String(f.d) : '' }); });
  if (st.ask === 'name' && !S.facts.some(f => f.k === 'Call me')) S.facts.unshift({ id: Date.now(), k:'Call me', v:S.name, d:'Pronunciation saved for the hosts' });
  S.salmaAck = out.ack_ar || null; S.salmaBusy = false; S.intake = Math.min(S.intake + 1, INTAKE.length - 1);
  if (S.intake === INTAKE.length - 1) makePilot();
  render(true); salmaSpeak();
}
function salmaSpeak(){ const st = INTAKE[S.intake]; const l = []; if (S.salmaAck) l.push(['S', S.salmaAck, 'ar']); l.push(['S', st.ar, 'ar']); if (st.target) l.push(['K', st.target, 'en']); say(l); }

/* ---- the pilot, written for this learner ---- */
let pilotPromise = null;
function makePilot(){
  if (pilotPromise) return pilotPromise;
  S.pilotReady = false;
  const prompt = 'Write the opening of a personal English podcast for one learner. Hosts: Karim (playful, opinionated) and Mona (sharp, dry). Learner: '+S.name+', an Arabic speaker around B1. Topic the learner could talk about for an hour: '+S.topic+'. Use simple, common words (about 95% should be very common). Exactly 7 lines. Line 1: Karim welcomes '+S.name+' by name to the first episode of their show. Lines 2 to 6: the hosts take opposite sides on a fun, specific question about the topic, with a little humour. Line 7: Karim throws that question to '+S.name+' by name, answerable in one or two sentences. Each line at most 22 words, no emoji, no stage directions.\nReturn only JSON: {"title": a catchy episode title of at most 5 words, "lines": [["K" or "M", text], ...7 items], "question": the question from line 7 in at most 8 words}';
  pilotPromise = askJSON(prompt).then(out => {
    if (out && Array.isArray(out.lines) && out.lines.length >= 4 && out.lines.every(l => Array.isArray(l) && (l[0]==='K'||l[0]==='M') && typeof l[1]==='string')) {
      S.pilotLines = out.lines.slice(0,8); S.pilotTitle = String(out.title || 'Your first episode').slice(0, 40); S.pilotQ = String(out.question || 'What do you think?').slice(0, 80); S.pilotLive = true;
    } else { S.pilotLines = null; S.pilotTitle = 'Midfield or goalkeeper?'; S.pilotQ = 'Midfield or goalkeeper?'; }
  }).finally(() => { setTimeout(() => { S.pilotReady = true; if (S.screen === 'casting') render(true); }, LIVE ? 0 : 3500); });
  return pilotPromise;
}

/* ---- chat ---- */
async function chatTurn(text){
  chatInit(); const C = S.chat; if (C.busy || C.ended || !text) return;
  C.log.push({ me:text }); C.turns.push({ role:'user', content:text }); C.busy = true; render(true); scrollChat();
  let out = await askJSON([{ role:'user', content: MONA_RULES() + '\n\nOpen the chat by asking the learner to restate one point from the call.' }].concat(C.turns));
  if (!out || typeof out.reply !== 'string') { const nx = CHAT_SCRIPT[Math.min(C.step + 1, CHAT_SCRIPT.length - 1)]; out = { reply: nx.m, recast: nx.r || [], end: !!nx.end }; }
  C.step++; if (C.step >= 4) out.end = true;
  C.turns.push({ role:'assistant', content: JSON.stringify(out) });
  C.log.push({ h: out.reply, r: Array.isArray(out.recast) ? out.recast : [] }); C.busy = false; C.ended = !!out.end;
  render(true); scrollChat();
}
function scrollChat(){ const s = document.getElementById('chatscr'); if (s) s.scrollTop = s.scrollHeight; }

  later(){ S.doors.listen = true; go('today'); },
  callToday(){ startCall('today'); },
  goRead(){ go('read'); },
  goChat(){ go('chat'); },
  callSend(){ const i = document.getElementById('callIn'); const v = i && i.value.trim(); if (v) callTurn(v, false); },
  callSugg(el){ const sc = CALL_SCRIPT[S.call.kind][Math.min(S.call.step, CALL_SCRIPT[S.call.kind].length - 1)]; const s = sc.s[+el.dataset.i];
    if (s.startsWith('[WORD]')) { S.call.wordOpen = true; render(true); return; } callTurn(s, false); },
  wordOpen(){ if (!S.call || S.call.ended) return; S.call.wordOpen = true; render(true); const i = document.getElementById('wordIn'); if (i) i.focus(); },
  wordClose(){ S.call.wordOpen = false; render(true); },
  wordSend(){ const i = document.getElementById('wordIn'); const v = i && i.value.trim(); if (v) callTurn(v, true); },
  endCall(){ const C = S.call; S.lastCall = Math.max(C ? C.secs : 0, 1); stopClock(); TTS.stop(); sayStop();
    if (C && C.kind === 'first') go('firstbye'); else { S.doors.call = true; S.doors.listen = true; go('after'); } },
  readAloud(){ say(ARTICLE.map(p => ['K', p, 'en'])); },
  readDone(){ S.doors.read = true; S.doors.listen = true; startCall('today'); },
  chatSend(){ const i = document.getElementById('chatIn'); const v = i && i.value.trim(); if (v) chatTurn(v); },
  chatSugg(){ chatInit(); chatTurn(CHAT_SCRIPT[Math.min(S.chat.step, CHAT_SCRIPT.length - 1)].s); },
  pickTomorrow(el){ S.picked = IDEAS2[+el.dataset.i][1]; S.doors.chat = true; S.doors.listen = true; go('today'); toast('Tomorrow at ' + dropT() + '.'); },
  pickFirst(el){ S.firstPick = +el.dataset.i; render(true); },
  toDay9(){ S.scen = 'normal'; S.hero = 'today'; S.doors = {listen:false,read:false,call:false,chat:false}; go('today'); toast('Day 9 of the season.'); },
  copyFeed(){ const u = 'https://forone.app/feed/f7k2-private'; try { navigator.clipboard.writeText(u).then(() => toast('Feed link copied.'), () => toast(u)); } catch (e) { toast(u); } },
  drop(el){ S.drop = el.dataset.d; render(true); },
  keepRec(){ S.keepRec = !S.keepRec; render(true); },
  sheet(el){ S.sheet = el.dataset.s; render(true); },
  closeSheet(el, e){ if (e.target === el) { S.sheet = null; render(true); } },
  noop(){},
  ideaSend(){ const v = (document.getElementById('ideaIn') || {}).value || ''; S.sheet = null;
    if (S.screen === 'chat') { S.picked = v; S.doors.chat = true; S.doors.listen = true; go('today'); } else if (S.screen === 'tomorrow') { S.firstPick = -1; render(true); } else render(true);
    toast('Salma: got it. It’ll be ready at ' + dropT() + '.'); },
  swapEp(){ S.swapped = true; S.hero = 'second'; render(true); toast('Made the next idea instead. One swap a day.'); },
  makeSecond(){ S.hero = 'second'; S.secondExtra = true; S.doors = {listen:false,read:false,call:false,chat:false}; render(); toast('Made just now. It plays straight away.'); },
  recap(){ say([['K','Quick version. '+S.name+' has an interview on Sunday, and Mona played the hiring manager.','en'],['M','I was not nice. The lesson: rehearse the story, not one sentence.','en'],['K','So, '+S.name+'. One thing you would never say in an interview?','en']]); },
  sendNote(){ S.noteSent = true; render(true); },
  scen(el){ S.scen = el.dataset.v; if (S.scen !== 'normal') { S.doors = {listen:false,read:false,call:false,chat:false}; S.hero = 'today'; S.secondDone = false; } go('today'); },
  proofVar(el){ S.proofVar = el.dataset.v; render(true); },
  howknow(){ S.howOpen = !S.howOpen; render(true); },
  proofPlay(){ say([['S','أهلًا يا '+S.name+'. هذا أسبوعك.','ar'],['S','يوم الثلاثاء حكيت القصة كلها بصيغة الماضي.','ar'],['M','I went to Omar’s office and he asked me a lot of questions.','en'],['S','الأسبوع القادم: نتكلم عن الخطط.','ar']]); },
  worth(el){ S.worth = el.dataset.a; render(true); },
  workDel(el){ S.working.splice(+el.dataset.i, 1); toast('Removed. Salma will stop working on it.'); },
  workAdd(){ S.working.push({ t:'Small talk before the interview starts', q:'Added by you, today' }); render(true); },
  aboutDel(el){ S.about = S.about.filter(f => String(f.id) !== el.dataset.id); toast('Gone. The hosts won’t use it.'); },
  aboutYes(el){ const f = S.about.find(x => String(x.id) === el.dataset.id); if (f) { f.unsure = false; f.k = 'Work'; f.src = 'You confirmed it today.'; } render(true); },
  worldAdd(){ S.world.push({ d:'Nov 9', t:'Asked a colleague for feedback in English.' }); render(true); },
  tog(el){ const k = el.dataset.k; S[k] = !S[k]; el.setAttribute('aria-pressed', !!S[k]); },
  cancelAsk(){ S.cancelAsk = true; render(true); }, cancelNo(){ S.cancelAsk = false; render(true); },
  cancelYes(){ S.cancelled = true; S.cancelAsk = false; toast('Cancelled. Nothing else to do.'); },
  deleteAsk(){ S.deleteAsk = true; render(true); }, deleteNo(){ S.deleteAsk = false; render(true); },
  toast(el){ toast(el.dataset.m); },
  plan(el){ S.plan = el.dataset.k; render(true); },
  pay(){ S.subscribed = true; S.cancelled = false; S.sheet = null; go('subscribed'); },
  afterSub(){ S.scen = 'normal'; go('today'); },
  shelf(el){ const k = el.dataset.k; if (k === 'proof') go('proof'); else if (k) openPlayer(k); else toast('Every past episode replays with its text, article and chat.'); }
};

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go]'); if (!el) return;
  const act = el.dataset.act;
  if (act) { if (act === 'noop') return; if (act === 'closeSheet' && e.target !== el) return; const f = A[act]; if (f) f(el, e); return; }
  go(el.dataset.go);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (e.target.id === 'salmaIn') A.salmaSend();
    else if (e.target.id === 'callIn') A.callSend();
    else if (e.target.id === 'wordIn') A.wordSend();
    else if (e.target.id === 'chatIn') A.chatSend();
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.wd.g')) { e.preventDefault(); A.word(e.target); }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(true); }
});
document.addEventListener('input', e => { if (e.target.id === 'callIn' || e.target.id === 'chatIn') { if (S.screen === 'call') { speakingOn('Y'); clearTimeout(A._ty); A._ty = setTimeout(speakingOff, 500); } } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.screen && SCR[h] && h !== 'player' && h !== 'call') go(h); });

/* boot */
const h0 = location.hash.slice(1);
if (h0 && SCR[h0] && h0 !== 'player' && h0 !== 'call') S.screen = h0;
render();
setTimeout(paintStatic, 400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => paintStatic());
})();
</script>
